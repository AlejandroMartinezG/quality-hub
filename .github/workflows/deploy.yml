# Construye la imagen y la publica en GHCR.
# El despliegue lo hace Dokploy: en su panel, servicio "APP Plataforma" -> Deploy.
# Dokploy jala esta misma imagen usando el registry ghcr.io configurado en sus ajustes.

name: Build y publicar imagen

on:
  workflow_dispatch:  # Solo se ejecuta cuando tú lo ordenas manualmente

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build imagen Docker y subir a GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_BASE_PATH=

      - name: Siguiente paso
        run: |
          echo "Imagen publicada: ${{ steps.meta.outputs.tags }}"
          echo "Para que llegue a producción: Dokploy -> APP Plataforma -> Deploy"
